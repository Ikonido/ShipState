[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipcheck"
version = "0.1.0"
description = "Deterministic local checks for Python release-state consistency."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["packaging>=23.2"]
authors = [{ name = "Vladyslav Rudenko" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Ikonido/ShipCheck"
Repository = "https://github.com/Ikonido/ShipCheck"
Issues = "https://github.com/Ikonido/ShipCheck/issues"

[project.scripts]
shipcheck = "shipcheck.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
