[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shipstate"
version = "0.1.1"
description = "Keep release state consistent before you ship."
keywords = ["release", "consistency", "packaging", "cli", "ci"]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["packaging>=23.2", "PyYAML>=6.0"]
authors = [{ name = "Vladyslav Rudenko" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Ikonido/ShipState"
Repository = "https://github.com/Ikonido/ShipState"
Issues = "https://github.com/Ikonido/ShipState/issues"

[project.scripts]
shipstate = "shipstate.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PIE"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = false
