name: Publish ShipState to TestPyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish to TestPyPI
        required: true
        default: v0.1.1
        type: string

concurrency:
  group: testpypi-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # Dispatch from main so a tag created before this workflow can be tested.
    # The package checkout below still uses only the explicitly selected tag.
    if: github.ref == 'refs/heads/main'
    name: Build and smoke-test release artifacts
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected = f"v{project['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          tagged_commit = subprocess.run(
              ["git", "rev-parse", f"refs/tags/{actual}^{{}}"],
              check=True,
              capture_output=True,
              text=True,
              timeout=10,
          ).stdout.strip()
          checked_out_commit = subprocess.run(
              ["git", "rev-parse", "HEAD"],
              check=True,
              capture_output=True,
              text=True,
              timeout=10,
          ).stdout.strip()
          if tagged_commit != checked_out_commit:
              raise SystemExit("checked-out commit does not match the release tag")
          PY

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Check release consistency
        run: shipstate check .

      - name: Run test suite
        run: python -m pytest -q

      - name: Build distributions and validate metadata
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build --sdist --wheel
          python -m twine check dist/*

      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/shipstate-wheel
          /tmp/shipstate-wheel/bin/python -m pip install dist/*.whl
          /tmp/shipstate-wheel/bin/shipstate --help
          /tmp/shipstate-wheel/bin/shipstate --version
          /tmp/shipstate-wheel/bin/python -m pip check

      - name: Smoke-test sdist
        run: |
          python -m venv /tmp/shipstate-sdist
          /tmp/shipstate-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/shipstate-sdist/bin/shipstate --help
          /tmp/shipstate-sdist/bin/shipstate --version
          /tmp/shipstate-sdist/bin/python -m pip check

      - name: Upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shipstate-test-dists
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to TestPyPI
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/shipstate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shipstate-test-dists
          path: dist/

      - name: Publish to TestPyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  verify:
    name: Verify the installed TestPyPI package
    timeout-minutes: 10
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tested release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Download the tested distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shipstate-test-dists
          path: dist/

      - name: Read runtime dependencies and version from the tag
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          output = Path(os.environ["RUNNER_TEMP"])
          (output / "runtime-requirements.txt").write_text(
              "\n".join(project.get("dependencies", [])) + "\n", encoding="utf-8"
          )
          (output / "version.txt").write_text(project["version"], encoding="utf-8")
          PY

      - name: Install from separate indexes and compare the published wheel
        run: |
          python -m venv "$RUNNER_TEMP/testpypi-install"
          PYTHON="$RUNNER_TEMP/testpypi-install/bin/python"
          "$PYTHON" -m pip install --index-url https://pypi.org/simple/ -r "$RUNNER_TEMP/runtime-requirements.txt"
          VERSION=$(cat "$RUNNER_TEMP/version.txt")
          "$PYTHON" -m pip download --index-url https://test.pypi.org/simple/ --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/testpypi-wheel" "shipstate==$VERSION"
          cmp dist/*.whl "$RUNNER_TEMP"/testpypi-wheel/*.whl
          "$PYTHON" -m pip install --no-index --no-deps "$RUNNER_TEMP"/testpypi-wheel/*.whl
          "$PYTHON" -m pip check
          "$RUNNER_TEMP/testpypi-install/bin/shipstate" --version
          "$RUNNER_TEMP/testpypi-install/bin/shipstate" --help
          "$RUNNER_TEMP/testpypi-install/bin/shipstate" check .
