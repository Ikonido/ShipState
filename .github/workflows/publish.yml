name: Publish ShipState to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build and smoke-test release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected = f"v{project['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          tag_commit = os.popen(f"git rev-parse refs/tags/{actual}^{{}}").read().strip()
          if not tag_commit or tag_commit != os.popen("git rev-parse HEAD").read().strip():
              raise SystemExit("checked-out commit does not match the release tag")
          PY

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Build distributions and validate metadata
        run: |
          python -m pip install --disable-pip-version-check build twine
          python -m build --sdist --wheel
          python -m twine check dist/*

      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/shipstate-wheel
          /tmp/shipstate-wheel/bin/python -m pip install dist/*.whl
          /tmp/shipstate-wheel/bin/shipstate --help
          /tmp/shipstate-wheel/bin/shipstate --version
          /tmp/shipstate-wheel/bin/python -m pip check

      - name: Smoke-test sdist
        run: |
          python -m venv /tmp/shipstate-sdist
          /tmp/shipstate-sdist/bin/python -m pip install dist/*.tar.gz
          /tmp/shipstate-sdist/bin/shipstate --help
          /tmp/shipstate-sdist/bin/shipstate --version
          /tmp/shipstate-sdist/bin/python -m pip check

      - name: Upload release distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shipstate-dists
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/shipstate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shipstate-dists
          path: dist/

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          print-hash: true
